<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KHAITECH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
<div id="login" class="login" hidden></div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="alogo" href="#overview" aria-label="KHAITECH Admin home">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="31" rx="9" fill="var(--accent)"/><rect x="11" y="7" width="12" height="20" rx="3" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><circle cx="17" cy="23" r="1.4" fill="var(--signal)"/><path d="M13.5 12l7 5" stroke="var(--signal)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>KHAITECH <small>Admin</small></span>
    </a>
    <nav id="nav" aria-label="Dashboard">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#repairs" data-v="repairs">Repairs <span class="nb" id="nbRepairs" hidden></span></a>
      <a href="#stock" data-v="stock">Stock</a>
      <a href="#sales" data-v="sales">Sales</a>
      <a href="#settings" data-v="settings">Settings</a>
    </nav>
    <div class="side-foot">
      <a href="../">View store</a>
      <button type="button" data-act="logout">Log out</button>
    </div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
